name: Publish scheduled blog posts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-scheduled-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate scheduler configuration
        env:
          CRON_TARGET_URL: \${{ secrets.CRON_TARGET_URL }}
          CRON_SECRET: \${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          if [ -z "$CRON_TARGET_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_TARGET_URL and CRON_SECRET repository secrets are required."
            exit 1
          fi
          case "$CRON_TARGET_URL" in
            https://*) ;;
            *) echo "CRON_TARGET_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Publish due editorial posts
        env:
          CRON_TARGET_URL: \${{ secrets.CRON_TARGET_URL }}
          CRON_SECRET: \${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          BASE_URL="\${CRON_TARGET_URL%/}"
          curl --fail --show-error --silent \\
            --connect-timeout 10 \\
            --max-time 45 \\
            --retry 2 \\
            --retry-delay 5 \\
            --retry-all-errors \\
            --request POST \\
            --header "Authorization: Bearer \${CRON_SECRET}" \\
            --header "Accept: application/json" \\
            "\${BASE_URL}/api/cron/publish-blog"
