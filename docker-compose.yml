services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoikiji
      POSTGRES_USER: yoikiji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - yoikiji_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoikiji -d yoikiji"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://yoikiji:${POSTGRES_PASSWORD}@db:5432/yoikiji?schema=public
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
      DATABASE_URL: postgresql://yoikiji:${POSTGRES_PASSWORD}@db:5432/yoikiji?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - private

volumes:
  yoikiji_postgres:

networks:
  private:
    driver: bridge
